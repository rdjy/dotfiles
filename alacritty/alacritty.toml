import = [
"~/.config/alacritty/solarized_dark.toml"
]

live_config_reload = true

[window]
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 0.97
dynamic_padding = true
blur = true
title = "term"
dynamic_title = true
option_as_alt = "OnlyLeft"

[window.padding]
x = 5
y = 5

[font]
size = 12.0

[font.normal]
family = "DejaVu Sans Mono"

[env]
TERM = "xterm-256color"

[mouse]
hide_when_typing = true

[shell]
program = "/bin/zsh"
args = ["--login", "-c", "$HOME/.nix-profile/bin/tmux", "-u"]
